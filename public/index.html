<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family PT Coach</title>
<meta name="theme-color" content="#0a6a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PT Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Familjen+Grotesk:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: phone-first single column, sticky profile bar on top, fixed tab bar at the bottom; session mode takes the whole screen */
:root{
  --bg:#eef3f5; --surface:#ffffff; --ink:#13222a; --muted:#56676f; --line:#d4dfe4;
  --accent:#0a6a86; --accent-ink:#ffffff; --accent-soft:#d8ebf1;
  --ok:#2c7a4c; --ok-soft:#dcefe3; --warn:#9a5c00; --warn-soft:#f6e9d2; --bad:#b3261e;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d161b; --surface:#152129; --ink:#e4edf0; --muted:#93a6ae; --line:#26363f;
  --accent:#53b6d2; --accent-ink:#04202a; --accent-soft:#16343f;
  --ok:#6cc790; --ok-soft:#173327; --warn:#e3a94f; --warn-soft:#3a2c14; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d161b; --surface:#152129; --ink:#e4edf0; --muted:#93a6ae; --line:#26363f;
  --accent:#53b6d2; --accent-ink:#04202a; --accent-soft:#16343f;
  --ok:#6cc790; --ok-soft:#173327; --warn:#e3a94f; --warn-soft:#3a2c14; --bad:#f08a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.insession{padding-bottom:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:19px}
.sync{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px 5px 5px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{padding:5px 12px;color:var(--muted);font-weight:400}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero{gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero h2{font-size:28px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.rest{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:16px;font-size:18px;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.banner p{margin:0;flex:1}
.exlist{display:flex;flex-direction:column;gap:10px}
.ex{display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.ex h3{font-size:18px}
.dose{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.ex .notes{grid-column:1/-1;font-size:14px;color:var(--muted);margin:0;white-space:pre-wrap}
.ex .tools{display:flex;flex-direction:column;gap:4px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:32px;display:grid;place-items:center;padding:0}
.band{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25)}
.tag{font-size:13px;color:var(--accent);font-weight:700;display:inline-flex;gap:4px;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:700}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.hist{display:flex;flex-direction:column}
.hist div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.hist div:first-child{border-top:0}
.hist .d{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.hist .n{min-width:0;overflow-wrap:anywhere}
.pain{font-family:var(--mono);font-weight:700}
/* session */
.sess{display:flex;flex-direction:column;gap:14px}
.sess .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
video.vid{width:100%;max-width:100%;border-radius:12px;background:#000;max-height:42vh}
.counter{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.counter .lbl{font-size:15px;color:var(--muted);font-weight:700}
.counter .big{font-family:var(--mono);font-size:76px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.counter .big small{font-size:32px;color:var(--muted)}
.counter .phase{font-family:var(--display);font-size:22px;font-weight:700}
.counter.hold .phase{color:var(--accent)}
.counter.rest .phase{color:var(--ok)}
.tbar{width:100%;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent)}
.counter.rest .tbar i{background:var(--ok)}
.tap{width:100%;min-height:120px;font-size:26px;border-radius:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.painscale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.painscale button{padding:10px 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--mono);font-weight:700}
.painscale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,15,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f .l{font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,1fr)}}
.bands{display:flex;flex-wrap:wrap;gap:6px}
.bands label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;color:var(--ink);font-weight:400}
.bands input{position:absolute;opacity:0;width:1px;height:1px}
.bands label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days label{text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 0;font-size:13px;color:var(--ink)}
.days input{position:absolute;opacity:0;width:1px;height:1px}
.days label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.vbox{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--bad);font-size:14px}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk div{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.wk div b{font-family:var(--mono);font-size:13px}
.wk .full{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.wk .part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.wk .today{outline:2px solid var(--accent);outline-offset:1px}
.wk .fut{opacity:.55}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.cb{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;font-size:24px;font-weight:700;color:transparent}
.check.on .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.check.on h3{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.check h3{font-size:18px}
.check .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.check .acts{display:flex;gap:6px}
.check .more{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.up{color:var(--ok);font-weight:700}
.daytabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.daytab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.daytab small{font-weight:400;color:var(--muted);font-size:12px}
.daytab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daytab[aria-pressed="true"] small{color:inherit;opacity:.85}
.check2{display:flex;gap:8px;align-items:center;font-size:15px}
.check2 input{width:20px;height:20px;accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top" id="top"><div class="wrap">
  <div class="brand"><h1>Family PT Coach</h1><span class="sync" id="sync">Saved on this phone</span></div>
  <div class="chips" id="chips"></div>
</div></header>
<main><div class="wrap" id="main"></div></main>
<nav class="tabs" id="tabs"><div class="wrap">
  <button data-a="nav" data-id="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Today</button>
  <button data-a="nav" data-id="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button data-a="nav" data-id="program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg>Program</button>
</div></nav>
<div id="modal" hidden></div>

<script>
(function(){
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const BANDS={'':['None',null],yellow:['Yellow','#f2d02b'],red:['Red','#d23b2f'],green:['Green','#2f9a4f'],blue:['Blue','#2a63c4'],black:['Black','#1b1b1b'],silver:['Silver','#b8bec4'],gold:['Gold','#c9a227']};
const HUES=['#0a6a86','#8a4fb3','#c0562f','#2c7a4c','#b0306a','#5a6b16'];
const SIDES={both:'',each:'each side',left:'left only',right:'right only'};
const DEMOS={
 'glute-bridge':{name:'Glute bridge',url:'/demos/glute-bridge.mp4',match:/bridg/},
 'clamshell':{name:'Clamshell',url:'/demos/clamshell.mp4',match:/clam/},
 'heel-slide':{name:'Heel slide',url:'/demos/heel-slide.mp4',match:/heel ?slide/},
 'calf-stretch':{name:'Calf stretch',url:'/demos/calf-stretch.mp4',match:/calf.*stretch|gastroc|soleus/},
 'prone-press-up':{name:'Prone press-up',url:'/demos/prone-press-up.mp4',match:/press.?up/},
 'pelvic-tilt':{name:'Pelvic tilt',url:'/demos/pelvic-tilt.mp4',match:/pelvic tilt/},
 'nerve-glide':{name:'Sciatic nerve glide',url:'/demos/nerve-glide.mp4',match:/nerve (glide|floss)|sciatic/},
 'dead-bug':{name:'Dead bug',url:'/demos/dead-bug.mp4',match:/dead ?bug/},
 'bird-dog':{name:'Bird dog',url:'/demos/bird-dog.mp4',match:/bird ?dog/},
 'side-plank-knees':{name:'Side plank (knees)',url:'/demos/side-plank-knees.mp4',match:/side plank/},
 'cat-cow':{name:'Cat-cow',url:'/demos/cat-cow.mp4',match:/cat.?cow/},
 'childs-pose':{name:"Child's pose",url:'/demos/childs-pose.mp4',match:/child/},
 'figure-four':{name:'Figure-4 stretch',url:'/demos/figure-four.mp4',match:/figure.?(4|four)|piriformis/},
 'hip-flexor-stretch':{name:'Hip flexor stretch',url:'/demos/hip-flexor-stretch.mp4',match:/hip flexor/},
 'hamstring-strap':{name:'Hamstring stretch (strap)',url:'/demos/hamstring-strap.mp4',match:/hamstring/},
 'prone-y':{name:'Prone Y raise',url:'/demos/prone-y.mp4',match:/\by[ -]?(raise|lift)/},
 'prone-t':{name:'Prone T raise',url:'/demos/prone-t.mp4',match:/\bt[ -]?(raise|lift)/},
 'prone-i':{name:'Prone I raise',url:'/demos/prone-i.mp4',match:/\bi[ -]?(raise|lift)/}
};
const EXAMPLES=[
 {name:'Glute bridge',sets:2,reps:10,holdSec:3,restSec:30,side:'both',band:'',progress:true},
 {name:'Clamshell',sets:2,reps:12,holdSec:0,restSec:30,side:'each',band:'yellow',progress:true},
 {name:'Heel slide',sets:2,reps:10,holdSec:0,restSec:20,side:'each',band:'',progress:true},
 {name:'Calf stretch',sets:1,reps:3,holdSec:30,restSec:10,side:'each',band:'',progress:false}
];
const S2='Stage 2: start these once the leg pain is settling. Turn on weekly reps once they feel easy.';
const PRESETS={lumbar:{name:'Lumbar pinched nerve (sciatica)',
  about:'Calms an irritated nerve in the low back first, then builds core support. Most of it is done every day; the core work goes on Day 2.',
  flags:'Get checked right away (ER or same-day doctor) for numbness in the groin or inner thighs, new bladder or bowel trouble, a leg or foot getting weaker, or severe pain with fever.',
  rule:'Watch where the leg pain goes. If it pulls back toward your spine or the leg feels better, keep going. If pain or tingling spreads further down the leg, stop that exercise and skip it for now.',
  daily:[
   {name:'Cat-cow',sets:1,reps:10,holdSec:0,restSec:0,demo:'cat-cow',notes:'Good first thing in the morning. Slow, move with your breath.'},
   {name:'Prone press-up',sets:1,reps:10,holdSec:2,restSec:0,demo:'prone-press-up',notes:'Hips stay on the floor, let the low back sag. If a full press-up is too much, rest on your elbows. Can repeat every 2–3 hours if it helps. Stop if pain spreads further down the leg.'},
   {name:'Pelvic tilt',sets:1,reps:10,holdSec:5,restSec:0,demo:'pelvic-tilt',notes:'On your back, knees bent. Tighten your belly and flatten the low back into the floor.'},
   {name:'Sciatic nerve glide',sets:1,reps:10,holdSec:0,restSec:0,demo:'nerve-glide',notes:'Sore leg. Sit tall, straighten the knee as you look up, bend it as you tuck your chin. Gentle, like flossing. Never a hard stretch.'},
   {name:'Figure-4 stretch',sets:2,reps:1,holdSec:30,restSec:10,side:'each',demo:'figure-four',notes:'On your back, ankle on the opposite knee, pull that thigh toward you. Stretch is in the buttock.'},
   {name:'Hip flexor stretch',sets:2,reps:1,holdSec:30,restSec:10,side:'each',demo:'hip-flexor-stretch',notes:'Half-kneeling with a pad under the knee. Tuck your pelvis under, then shift forward.'},
   {name:'Hamstring stretch (strap)',sets:2,reps:1,holdSec:30,restSec:10,side:'each',demo:'hamstring-strap',notes:'On your back with a strap or towel. Gentle. If it sends tingling down the leg, skip it and do the nerve glide instead.'},
   {name:"Child's pose",sets:2,reps:1,holdSec:30,restSec:10,demo:'childs-pose',notes:'Skip it if it sends pain down the leg. Some disc problems don’t like bending forward.'},
   {name:'Walk',sets:1,reps:10,holdSec:0,restSec:0,unit:'min',demo:'none',notes:'Flat ground, 2–3 times a day. One of the best things you can do for this.'}],
  day2:[
   {name:'Glute bridge',sets:2,reps:10,holdSec:3,restSec:30,demo:'glute-bridge',notes:S2},
   {name:'Dead bug',sets:2,reps:8,holdSec:0,restSec:30,side:'each',demo:'dead-bug',notes:'Low back stays pressed down. '+S2},
   {name:'Bird dog',sets:2,reps:8,holdSec:5,restSec:30,side:'each',demo:'bird-dog',notes:'Back flat like a table. '+S2},
   {name:'Side plank (from knees)',sets:3,reps:1,holdSec:20,restSec:20,side:'each',demo:'side-plank-knees',notes:'Elbow under shoulder, straight line head to knees. Work up from 15 to 20 s. '+S2}],
  avoid:'Avoid for now: toe-touches, sit-ups and crunches, heavy lifting, twisting while lifting, and sitting slumped for more than 30 minutes.'},
 yti:{name:'Rotator cuff Y-T-I raises',
  about:'Strengthens the rotator cuff and the muscles that hold the shoulder blades back. Goes on Day 3 (arms), with reps going up each week like the rest of your program.',
  rule:'A muscle burn between the shoulder blades is fine. Sharp or pinching pain in the front or top of the shoulder is not: stop that one and lower the height or skip it.',
  day3:[
   {name:'Prone Y raise',sets:2,reps:10,holdSec:2,restSec:30,demo:'prone-y',progress:true,notes:'Face down on a bed, bench or the floor (towel under your forehead). Arms in a Y, thumbs up toward the ceiling. Lead with the shoulder blades: squeeze them down and back, then lift a few inches.'},

const dayKey=()=>keyOf(new Date());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const mondayOf=k=>{const d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)};

  dayTypes:[{id:rid(),name:'Legs & hips',exercises:withExamples?EXAMPLES.map(e=>newEx({...e,notes:'Example — replace with your own.'})):[]},{id:rid(),name:'Spine & abs',exercises:[]},{id:rid(),name:'Arms',exercises:[]}]}}
function defaultState(){const p=newProfile('Me',0,true);return{v:2,activeId:p.id,exampleBanner:true,profiles:[p]}}
function migrate(st){
  if(!st||!Array.isArray(st.profiles)||!st.profiles.length)return defaultState();
  if(st.v===2){for(const p of st.profiles)if(!p.daily)p.daily={id:DAILY,name:'Every day',exercises:[]};return st}
  const out={v:2,activeId:st.activeId,exampleBanner:st.exampleBanner!==false,profiles:st.profiles.map(o=>{const p=newProfile(o.name,o.hue||0,false);p.id=o.id;p.reminder={time:(o.reminder&&o.reminder.time)||'07:30'};p.dayTypes[0].exercises=(o.exercises||[]).map(e=>newEx({...e,progress:e.holdSec>=20?false:true}));return p})};
  if(!out.profiles.find(p=>p.id===out.activeId))out.activeId=out.profiles[0].id;
  return out;
}

const prof=()=>ST.profiles.find(p=>p.id===ST.activeId)||ST.profiles[0];
const docKey=(p,date)=>p.id+'_'+date;
const docOf=(p,date)=>DD[docKey(p,date)];
const anyChecked=d=>d&&d.checked&&Object.values(d.checked).some(Boolean);
function weekNo(p,date){return Math.max(1,Math.floor(diffDays(p.startDate,date)/7)+1)}
function repsFor(p,ex,date){return ex.progress===false?ex.reps:ex.reps+(p.increment||0)*(weekNo(p,date)-1)}
function dtIndex(p,id){return p.dayTypes.findIndex(d=>d.id===id)}
function getList(p,id){return id===DAILY?p.daily:p.dayTypes[dtIndex(p,id)]}
const todayList=(p,dt)=>[...p.daily.exercises,...dt.exercises];
function planFor(p,date){
  const d=docOf(p,date);
  if(d&&dtIndex(p,d.dayTypeId)>=0)return p.dayTypes[dtIndex(p,d.dayTypeId)];
  let best=null;
  for(const k in DD){const x=DD[k];if(x.pid===p.id&&x.date<date&&anyChecked(x)&&(!best||x.date>best.date))best=x}
  if(!best)return p.dayTypes[0];
  const i=dtIndex(p,best.dayTypeId);
  return p.dayTypes[(i<0?0:i+1)%p.dayTypes.length];
}
function ensureDoc(p,date,dt){const k=docKey(p,date);if(!DD[k])DD[k]={pid:p.id,date,dayTypeId:dt.id,checked:{},reps:{},pain:null,note:''};return DD[k]}
function streak(p){const set=new Set(Object.values(DD).filter(x=>x.pid===p.id&&anyChecked(x)).map(x=>x.date));let k=dayKey(),n=0;if(!set.has(k))k=addDays(k,-1);while(set.has(k)){n++;k=addDays(k,-1)}return n}
function sidesOf(ex){return ex.side==='each'?['Left side','Right side']:ex.side==='left'?['Left side']:ex.side==='right'?['Right side']:['']}
function doseText(ex,reps){if(ex.unit==='min')return reps+' min';let t=ex.sets+' × '+reps;if(ex.holdSec>0)t+=' · '+ex.holdSec+' s hold';if(SIDES[ex.side])t+=' · '+SIDES[ex.side];return t}
function demoFor(ex){if(!ex||ex.demo==='none')return null;if(ex.demo&&DEMOS[ex.demo])return DEMOS[ex.demo];const n=(ex.name||'').toLowerCase();return Object.values(DEMOS).find(d=>d.match.test(n))||null}
const vidSrc=ex=>ex.videoUrl||(demoFor(ex)||{}).url||'';
function avatar(p){return'<span class="av" style="background:'+HUES[p.hue%HUES.length]+'">'+esc(((p.name||'?').trim()[0]||'?').toUpperCase())+'</span>'}
function bandHtml(b){if(!b||!BANDS[b])return'';return'<span class="band"><span class="sw" style="background:'+BANDS[b][1]+'"></span>'+BANDS[b][0]+' band</span>'}
function fmtTime(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return((h%12)||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')}
const dayLabel=(p,dt)=>dt.id===DAILY?'Every day':'Day '+(dtIndex(p,dt.id)+1);

function vWeek(){

function chart(pts){
  if(pts.length<2)return'<p class="muted small" style="margin:0">Rate two finished workouts to see a trend.</p>';
  const W=320,H=150,L=26,R=10,T=10,B=22,iw=W-L-R,ih=H-T-B,x=i=>L+i*iw/(pts.length-1),y=v=>T+ih-v/10*ih;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Pain trend">';
  for(const v of[0,5,10])s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  const line=pts.map((p,i)=>x(i).toFixed(1)+','+y(p.pain).toFixed(1)).join(' ');
  s+='<polygon class="ar" points="'+x(0)+','+y(0)+' '+line+' '+x(pts.length-1)+','+y(0)+'"/><polyline class="ln" points="'+line+'"/>';
  pts.forEach((p,i)=>{const e=i===pts.length-1;s+='<circle class="'+(e?'end':'pt')+'" cx="'+x(i)+'" cy="'+y(p.pain)+'" r="'+(e?5:3.5)+'"/>'});
  const f=parseKey(pts[0].date),l=parseKey(pts[pts.length-1].date);
  return s+'<text x="'+L+'" y="'+(H-5)+'">'+(f.getMonth()+1)+'/'+f.getDate()+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+(l.getMonth()+1)+'/'+l.getDate()+'</text></svg>';
}

function beep(f,d){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(d||.15));o.start();o.stop(actx.currentTime+(d||.15))}catch(e){}try{navigator.vibrate&&navigator.vibrate(d>.2?200:60)}catch(e){}}
async function lockScreen(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
function startTimer(exId){
  const p=prof(),dt=planFor(p,dayKey()),ex=todayList(p,dt).find(e=>e.id===exId);if(!ex)return;
  S={exId,ex:{...clone(ex),reps:repsFor(p,ex,dayKey())},set:1,side:0,rep:0,phase:'ready',until:0,left:0,paused:false};

});
document.addEventListener('change',async e=>{
  if(e.target.id==='dt-name'){render();return}
  if((e.target.id==='f-demo'||e.target.id==='f-unit')&&MD){readExForm();openModal(exForm());return}
  if(e.target.id==='f-restore'&&MD){const f=e.target.files&&e.target.files[0];if(!f)return;
    try{const data=JSON.parse(await f.text());if(data.app!=='family-pt-coach'||!data.state)throw new Error('not a PT backup');
      ST=migrate(data.state);DD=data.days||{};await loadVideos();try{localStorage.setItem('ptc-state',JSON.stringify(ST));localStorage.setItem('ptc-days',JSON.stringify(DD))}catch(x){}
      closeModal();render();setSync('Backup restored')}catch(err){MD.berr='That file isn’t a PT Coach backup ('+err.message+').';MD.bok='';openModal(profForm())}return}
  if(e.target.id!=='f-vid'||!MD)return;
  const file=e.target.files&&e.target.files[0];if(!file)return;readExForm();MD.verr='';
  if(file.size>150*1024*1024){MD.verr='That clip is '+(file.size/1048576).toFixed(0)+' MB. Trim it under 150 MB (about 1–2 minutes) and try again.';openModal(exForm());return}
  MD.uploading=true;openModal(exForm());
  try{const r=await assets.upload(file);if(!MD)return;if(MD.ex.videoId)MD.removed.push(MD.ex.videoId);MD.ex.videoId=r.id;MD.ex.videoUrl=r.url;MD.cancelUploads.push(r.id)}catch(err){if(MD)MD.verr='Couldn’t save the video: '+(err&&err.message||'phone storage may be full')+'.'}
  if(MD){MD.uploading=false;openModal(exForm())}
});
document.addEventListener('visibilitychange',()=>{if(S&&document.visibilityState==='visible')lockScreen()});
let lastDay=dayKey();setInterval(()=>{if(dayKey()!==lastDay){lastDay=dayKey();if(!S&&!MD)render()}},60000);
const busy=()=>S||(MD&&MD.kind!=='delday')||(document.activeElement&&['dt-name','t-note'].includes(document.activeElement.id));

/* ---------- start ---------- */
render();
(async()=>{
  await loadVideos();if(!busy())render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
})();
</script>
