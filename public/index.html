<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family PT Coach</title>
<meta name="theme-color" content="#0a6a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PT Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Familjen+Grotesk:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: phone-first single column, sticky profile bar on top, fixed tab bar at the bottom; session mode takes the whole screen */
:root{
  --bg:#eef3f5; --surface:#ffffff; --ink:#13222a; --muted:#56676f; --line:#d4dfe4;
  --accent:#0a6a86; --accent-ink:#ffffff; --accent-soft:#d8ebf1;
  --ok:#2c7a4c; --ok-soft:#dcefe3; --warn:#9a5c00; --warn-soft:#f6e9d2; --bad:#b3261e;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d161b; --surface:#152129; --ink:#e4edf0; --muted:#93a6ae; --line:#26363f;
  --accent:#53b6d2; --accent-ink:#04202a; --accent-soft:#16343f;
  --ok:#6cc790; --ok-soft:#173327; --warn:#e3a94f; --warn-soft:#3a2c14; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d161b; --surface:#152129; --ink:#e4edf0; --muted:#93a6ae; --line:#26363f;
  --accent:#53b6d2; --accent-ink:#04202a; --accent-soft:#16343f;
  --ok:#6cc790; --ok-soft:#173327; --warn:#e3a94f; --warn-soft:#3a2c14; --bad:#f08a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.insession{padding-bottom:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:19px}
.sync{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px 5px 5px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{padding:5px 12px;color:var(--muted);font-weight:400}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero{gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero h2{font-size:28px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.rest{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:16px;font-size:18px;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.banner p{margin:0;flex:1}
.exlist{display:flex;flex-direction:column;gap:10px}
.ex{display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.ex h3{font-size:18px}
.dose{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.ex .notes{grid-column:1/-1;font-size:14px;color:var(--muted);margin:0;white-space:pre-wrap}
.ex .tools{display:flex;flex-direction:column;gap:4px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:32px;display:grid;place-items:center;padding:0}
.band{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25)}
.tag{font-size:13px;color:var(--accent);font-weight:700;display:inline-flex;gap:4px;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:700}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.hist{display:flex;flex-direction:column}
.hist div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.hist div:first-child{border-top:0}
.hist .d{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.hist .n{min-width:0;overflow-wrap:anywhere}
.pain{font-family:var(--mono);font-weight:700}
/* session */
.sess{display:flex;flex-direction:column;gap:14px}
.sess .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
video.vid{width:100%;max-width:100%;border-radius:12px;background:#000;max-height:42vh}
.counter{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.counter .lbl{font-size:15px;color:var(--muted);font-weight:700}
.counter .big{font-family:var(--mono);font-size:76px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.counter .big small{font-size:32px;color:var(--muted)}
.counter .phase{font-family:var(--display);font-size:22px;font-weight:700}
.counter.hold .phase{color:var(--accent)}
.counter.rest .phase{color:var(--ok)}
.tbar{width:100%;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent)}
.counter.rest .tbar i{background:var(--ok)}
.tap{width:100%;min-height:120px;font-size:26px;border-radius:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.painscale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.painscale button{padding:10px 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--mono);font-weight:700}
.painscale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,15,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f .l{font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,1fr)}}
.bands{display:flex;flex-wrap:wrap;gap:6px}
.bands label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;color:var(--ink);font-weight:400}
.bands input{position:absolute;opacity:0;width:1px;height:1px}
.bands label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days label{text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 0;font-size:13px;color:var(--ink)}
.days input{position:absolute;opacity:0;width:1px;height:1px}
.days label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.vbox{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--bad);font-size:14px}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk div{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.wk div b{font-family:var(--mono);font-size:13px}
.wk .full{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.wk .part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.wk .today{outline:2px solid var(--accent);outline-offset:1px}
.wk .fut{opacity:.55}
.wk .rst{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.wk button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0;cursor:pointer}
.wk button b{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.wk .full{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.wk .part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.wk .plan{border-style:dashed;color:var(--muted)}
.wk .sel{box-shadow:0 0 0 3px var(--accent)}
.dlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.dlist li{display:grid;grid-template-columns:22px 1fr;column-gap:8px;align-items:baseline;font-size:15px}
.dlist li .dose{grid-column:2;color:var(--muted)}
.dlist li .mk{font-weight:700;color:var(--ok)}
.dlist li.no{color:var(--muted)}
.dlist li.no .mk{color:var(--line)}
.edl{display:flex;flex-direction:column;gap:6px}
.edl button{display:grid;grid-template-columns:32px 1fr;column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font:inherit;color:inherit;cursor:pointer}
.edl button .bx{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent;grid-row:span 2}
.edl button[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.edl button .dose{grid-column:2;color:var(--muted);font-size:13px}
.dlist li .dose{font-size:13px}
.pill.missed{background:var(--warn-soft);color:var(--warn)}
.check.carry{border-color:var(--warn)}
.pill.restday{background:var(--accent-soft);color:var(--accent)}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.cb{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;font-size:24px;font-weight:700;color:transparent}
.check.on .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.check.on h3{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.check h3{font-size:18px}
.check .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.check .acts{display:flex;gap:6px}
.check .more{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.up{color:var(--ok);font-weight:700}
.daytabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.daytab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.daytab small{font-weight:400;color:var(--muted);font-size:12px}
.daytab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daytab[aria-pressed="true"] small{color:inherit;opacity:.85}
.check2{display:flex;gap:8px;align-items:center;font-size:15px}
.check2 input{width:20px;height:20px;accent-color:var(--accent)}
.gtag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--accent-soft);color:var(--accent)}
.gtag.g-legs{background:var(--ok-soft);color:var(--ok)}.gtag.g-core{background:var(--warn-soft);color:var(--warn)}.gtag.g-stretch,.gtag.g-cardio{background:var(--line);color:var(--muted)}
.pill.moved{background:var(--accent-soft);color:var(--accent)}
.soreline{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:-4px}
.soreline .btn{padding:4px 8px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top" id="top"><div class="wrap">
  <div class="brand"><h1>Family PT Coach</h1><span class="sync" id="sync">Saved on this phone</span></div>
  <div class="chips" id="chips"></div>
</div></header>
<main><div class="wrap" id="main"></div></main>
<nav class="tabs" id="tabs"><div class="wrap">
  <button data-a="nav" data-id="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Today</button>
  <button data-a="nav" data-id="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button data-a="nav" data-id="program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg>Program</button>
</div></nav>
<div id="modal" hidden></div>

<script>
(function(){
'use strict';
/* ============ constants ============ */
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK_ORDER=[1,2,3,4,5,6,0];
const BANDS={'':['None',null],yellow:['Yellow','#f2d02b'],red:['Red','#d23b2f'],green:['Green','#2f9a4f'],blue:['Blue','#2a63c4'],black:['Black','#1b1b1b'],silver:['Silver','#b8bec4'],gold:['Gold','#c9a227']};
const HUES=['#0a6a86','#8a4fb3','#c0562f','#2c7a4c','#b0306a','#5a6b16'];
const SIDES={both:'',each:'each side',left:'left only',right:'right only'};
const GROUPS={legs:{name:'Legs & hips',short:'Legs'},upper:{name:'Shoulders & arms',short:'Upper'},core:{name:'Core & back',short:'Core'},stretch:{name:'Stretch',short:'Stretch'},cardio:{name:'Walk / cardio',short:'Walk'},other:{name:'Other',short:'Other'}};
const STRENGTH=['legs','upper','core','other'];
const DEFAULT_DAYS=[1,2,3,4,5];
const DEMOS={
 'glute-bridge':{name:'Glute bridge',url:'/demos/glute-bridge.mp4',match:/bridg/},
 'clamshell':{name:'Clamshell',url:'/demos/clamshell.mp4',match:/clam/},
 'heel-slide':{name:'Heel slide',url:'/demos/heel-slide.mp4',match:/heel ?slide/},
 'calf-stretch':{name:'Calf stretch',url:'/demos/calf-stretch.mp4',match:/calf.*stretch|gastroc|soleus/},
 'prone-press-up':{name:'Prone press-up',url:'/demos/prone-press-up.mp4',match:/press.?up/},
 'pelvic-tilt':{name:'Pelvic tilt',url:'/demos/pelvic-tilt.mp4',match:/pelvic tilt/},
 'nerve-glide':{name:'Sciatic nerve glide',url:'/demos/nerve-glide.mp4',match:/nerve (glide|floss)|sciatic/},
 'dead-bug':{name:'Dead bug',url:'/demos/dead-bug.mp4',match:/dead ?bug/},
 'bird-dog':{name:'Bird dog',url:'/demos/bird-dog.mp4',match:/bird ?dog/},
 'side-plank-knees':{name:'Side plank (knees)',url:'/demos/side-plank-knees.mp4',match:/side plank/},
 'cat-cow':{name:'Cat-cow',url:'/demos/cat-cow.mp4',match:/cat.?cow/},
 'childs-pose':{name:"Child's pose",url:'/demos/childs-pose.mp4',match:/child/},
 'figure-four':{name:'Figure-4 stretch',url:'/demos/figure-four.mp4',match:/figure.?(4|four)|piriformis/},
 'hip-flexor-stretch':{name:'Hip flexor stretch',url:'/demos/hip-flexor-stretch.mp4',match:/hip flexor/},
 'hamstring-strap':{name:'Hamstring stretch (strap)',url:'/demos/hamstring-strap.mp4',match:/hamstring/},
 'prone-y':{name:'Prone Y raise',url:'/demos/prone-y.mp4',match:/\by[ -]?(raise|lift)/},
 'prone-t':{name:'Prone T raise',url:'/demos/prone-t.mp4',match:/\bt[ -]?(raise|lift)/},
 'prone-i':{name:'Prone I raise',url:'/demos/prone-i.mp4',match:/\bi[ -]?(raise|lift)/},
 'chair-squat':{name:'Chair squat',url:'/demos/chair-squat.mp4',match:/chair squat|sit.?to.?stand|box squat/},
 'band-row':{name:'Band row',url:'/demos/band-row.mp4',match:/\brows?\b/},
 'counter-pushup':{name:'Counter push-up',url:'/demos/counter-pushup.mp4',match:/(counter|wall|incline).*push.?up|push.?up/}
};
const NERVE=/press.?up|nerve (glide|floss)|sciatic|pelvic tilt/i;
const EXAMPLES=[
 {name:'Glute bridge',sets:2,reps:10,holdSec:3,restSec:30,group:'legs'},
 {name:'Clamshell',sets:2,reps:12,holdSec:0,restSec:30,side:'each',band:'yellow',group:'legs'},
 {name:'Heel slide',sets:2,reps:10,holdSec:0,restSec:20,side:'each',group:'legs'},
 {name:'Calf stretch',sets:1,reps:3,holdSec:30,restSec:10,side:'each',group:'stretch',progress:false}
];

/* ============ helpers ============ */
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const $=id=>document.getElementById(id);
const keyOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayKey=()=>keyOf(new Date());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const mondayOf=k=>{const d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)};
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const wd=k=>parseKey(k).getDay();
const fmtDay=k=>DAYS[wd(k)]+' '+(parseKey(k).getMonth()+1)+'/'+parseKey(k).getDate();

function guessGroup(e){
  const n=(e.name||'').toLowerCase(),dm=e.demo||'';
  if(e.unit==='min'||/\b(walk|bike|cycl|run|jog|swim|cardio|elliptical|treadmill)/.test(n))return'cardio';
  if(/stretch|pose|cat.?cow|yoga|figure.?(4|four)|glide|child/.test(n)||/stretch|childs|cat-cow|figure/.test(dm))return'stretch';
  if(/dead ?bug|bird ?dog|plank|pelvic|crunch|\babs?\b|core|superman|sit.?up|back ext/.test(n))return'core';
  if(/\b[yti][ -]?(raise|lift)|row|press|curl|push|shoulder|arm|pull|fly|tricep|bicep|chest|rotator|external rot|internal rot/.test(n))return'upper';
  if(/bridge|clam|squat|lunge|heel slide|calf|step|leg|hip|glute|knee|thigh|abduct|adduct/.test(n))return'legs';
  return'other';
}
const newEx=o=>{const e={id:rid(),name:'',sets:2,reps:10,holdSec:0,restSec:30,side:'both',band:'',notes:'',videoId:'',videoUrl:'',videoLink:'',demo:'',...o};
  if(!GROUPS[e.group])e.group=guessGroup(e);if(e.progress===undefined)e.progress=e.group!=='stretch';return e};

/* ============ weekly schedule ============ */
// Workout days alternate between two kinds so no muscle group is worked two days in a row:
// X = legs & hips (+ core when that balances better), Y = shoulders & arms. Each exercise goes on 2 days a week
// that aren't back to back, picking the lightest days, so the work is spread evenly.
const PER_WEEK=2;
function dayKinds(p){const days=WEEK_ORDER.filter(d=>(p.trainDays||[]).includes(d));
  const tryStart=s=>{const X=[],Y=[];days.forEach((d,i)=>((i+s)%2?Y:X).push(d));let bad=0;for(const d of days){const n=(d+1)%7;if(days.includes(n)&&X.includes(d)===X.includes(n))bad++}return{X,Y,days,bad}};
  const a=tryStart(0),b=tryStart(1);return b.bad<a.bad?b:a}
function kindFor(p,e,k){const g=e.group;if(!k.Y.length)return'all';
  if(g==='legs')return'X';if(g==='upper')return'Y';if(g==='stretch'||g==='cardio')return'all';
  const per=K=>{let n=0;for(const x of p.lib)if(x!==e&&p.week&&k[K].some(d=>(p.week[d]||[]).includes(x.id)))n++;return n/k[K].length};
  return per('X')<=per('Y')?'X':'Y'}
const adj=(a,b)=>((a+1)%7===b)||((b+1)%7===a);
function pickDays(p,cands,n){const load=d=>(p.week[d]||[]).length;if(cands.length<=n)return cands.slice();
  let best=null;const combos=[];const rec=(i,cur)=>{if(cur.length===n){combos.push(cur.slice());return}for(let j=i;j<cands.length;j++){cur.push(cands[j]);rec(j+1,cur);cur.pop()}};rec(0,[]);
  for(const c of combos){let sc=c.reduce((t,d)=>t+load(d),0);for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)if(adj(c[i],c[j]))sc+=100;
    if(!best||sc<best.sc)best={c,sc}}return best.c}
function placeOne(p,e){const k=dayKinds(p);if(!k.days.length)return;const kind=kindFor(p,e,k);const cands=kind==='all'?k.days:k[kind];
  for(const d of pickDays(p,cands,Math.min(PER_WEEK,cands.length))){const l=p.week[d]=p.week[d]||[];if(!l.includes(e.id))l.push(e.id)}}
function buildWeek(p){p.week={};for(const d of WEEK_ORDER)p.week[d]=[];
  const order={legs:0,upper:1,core:2,other:3,cardio:4,stretch:5};
  [...p.lib].sort((a,b)=>(order[a.group]??9)-(order[b.group]??9)).forEach(e=>placeOne(p,e));
  // keep each day's list in a sensible order: strength first, then walking, then stretches
  const g=new Map(p.lib.map(e=>[e.id,e.group]));for(const d of WEEK_ORDER)p.week[d].sort((x,y)=>(order[g.get(x)]??9)-(order[g.get(y)]??9));p.auto=true}
function scheduleDaysOf(p,id){return WEEK_ORDER.filter(d=>(p.week[d]||[]).includes(id))}
// Same strength group on two days in a row (stretches and walking don't count)
function backToBack(p){const out=[];for(const d of WEEK_ORDER){const n=(d+1)%7;const g1=new Set((p.week[d]||[]).map(id=>exById(p,id)).filter(Boolean).map(e=>e.group).filter(g=>STRENGTH.includes(g)));
  for(const id of (p.week[n]||[])){const e=exById(p,id);if(e&&g1.has(e.group)){out.push({d,n,g:e.group});g1.delete(e.group)}}}return out}

function newProfile(name,hue,withExamples){const p={v:3,id:rid(),name,hue,startDate:mondayOf(dayKey()),since:dayKey(),increment:2,reminder:{time:'07:30'},trainDays:DEFAULT_DAYS.slice(),lib:withExamples?EXAMPLES.map(e=>newEx({...e,notes:'Example — replace with your own.'})):[],week:{},auto:true,legacy:{names:{}}};buildWeek(p);return p}
function defaultState(){const p=newProfile('Me',0,true);return{v:3,activeId:p.id,exampleBanner:true,profiles:[p]}}
function toV2(st){ // first version (single list) → v2 shape
  return{v:2,activeId:st.activeId,exampleBanner:st.exampleBanner!==false,profiles:st.profiles.map(o=>({id:o.id,name:o.name,hue:o.hue||0,reminder:{time:(o.reminder&&o.reminder.time)||'07:30'},daily:{id:'daily',exercises:[]},dayTypes:[{id:'legacy1',name:'Legs & hips',exercises:(o.exercises||[]).map(e=>({...e}))}]}))}}
function migrate(st){
  if(!st||!Array.isArray(st.profiles)||!st.profiles.length)return defaultState();
  if(st.v===3){if(!st.upd)st.upd={};for(const p of st.profiles){p.lib=p.lib||[];p.week=p.week||{};p.trainDays=p.trainDays||DEFAULT_DAYS.slice();p.legacy=p.legacy||{names:{}};for(const e of p.lib)if(!GROUPS[e.group])e.group=guessGroup(e)}return st}
  if(st.v!==2)st=toV2(st);
  const out={v:3,activeId:st.activeId,exampleBanner:st.exampleBanner!==false,lastBackup:st.lastBackup,profiles:st.profiles.map(o=>{
    const seen=new Set(),lib=[];
    for(const e of [...((o.daily&&o.daily.exercises)||[]),...(o.dayTypes||[]).flatMap(d=>d.exercises||[])]){
      if(!e||seen.has(e.id))continue;seen.add(e.id);
      if(NERVE.test(e.name||'')||['prone-press-up','nerve-glide','pelvic-tilt'].includes(e.demo))continue; // dropped in the Nov 2026 redesign
      const n={...e};delete n.preset;n.group=guessGroup(n);n.progress=n.group!=='stretch';lib.push(n)}
    const p={v:3,id:o.id,name:o.name,hue:o.hue||0,startDate:mondayOf(dayKey()),since:dayKey(),increment:o.increment??2,reminder:o.reminder||{time:'07:30'},trainDays:DEFAULT_DAYS.slice(),lib,week:{},auto:true,
      migratedV3:true,legacy:{names:Object.fromEntries((o.dayTypes||[]).map(d=>[d.id,d.name]))}};
    buildWeek(p);return p})};
  if(!out.profiles.find(p=>p.id===out.activeId))out.activeId=out.profiles[0].id;
  return out;
}

function applyNov8(st){if(st.upd&&st.upd.nov8)return false;st.upd={...(st.upd||{}),nov8:true};let changed=false;
  for(const p of st.profiles){const cp=p.lib.find(e=>/child'?s pose/i.test(e.name));if(!cp)continue;
    p.lib=p.lib.filter(e=>e!==cp);for(const d in p.week)p.week[d]=(p.week[d]||[]).filter(x=>x!==cp.id);
    const have=new Set(p.lib.map(e=>e.name.toLowerCase()));for(const it of PRESETS.basics.items)if(!have.has(it.name.toLowerCase()))p.lib.push(newEx({side:'both',...it,preset:'basics'}));
    p.trainDays=[1,2,3,4,5];buildWeek(p);p.nov8=true;changed=true}
  return changed}

/* uploaded videos live in this phone's IndexedDB */
const VDB=(()=>{let pr=null;const open=()=>pr||(pr=new Promise((res,rej)=>{const r=indexedDB.open('ptc-videos',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=(mode,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('v',mode),st=t.objectStore('v');const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Phone storage is full'))}));
  return{put:(id,b)=>tx('readwrite',st=>st.put(b,id)),get:id=>tx('readonly',st=>st.get(id)),del:id=>tx('readwrite',st=>st.delete(id))}})();
const URLS={};
const assets=(typeof indexedDB==='undefined')?null:{
  async upload(blob){const id='v'+rid();await VDB.put(id,blob);URLS[id]=URL.createObjectURL(blob);return{id,url:URLS[id]}},
  async delete(id){try{URL.revokeObjectURL(URLS[id])}catch(e){}delete URLS[id];await VDB.del(id)}
};
async function loadVideos(){if(!assets)return;for(const p of ST.profiles)for(const ex of p.lib){if(!ex.videoId){ex.videoUrl='';continue}
  try{if(!URLS[ex.videoId]){const b=await VDB.get(ex.videoId);if(b)URLS[ex.videoId]=URL.createObjectURL(b)}}catch(e){}ex.videoUrl=URLS[ex.videoId]||''}}

function readStored(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')||fallback}catch(e){return fallback}}
ST=readStored('ptc-state',null);DD=readStored('ptc-days',{});

/* ============ saving ============ */
let saveT=null; const dayTimers={};
function setSync(t,bad){const el=$('sync');el.textContent=t;el.style.color=bad?'var(--bad)':''}
const failMsg='Not saved — phone storage is full or blocked. Save a backup in Settings.';
// Bring in anything newer another open copy of the app saved. Each day keeps whichever copy changed last.
function mergeStoredDays(){const st=readStored('ptc-days',{});let changed=false;
  for(const k in st){const a=st[k],b=DD[k];if(!b||((a&&a.t)||0)>((b&&b.t)||0)){if(!dayTimers[k]){DD[k]=a;changed=true}}}return changed}
function writeDays(){mergeStoredDays();localStorage.setItem('ptc-days',JSON.stringify(DD))}
function writeState(){ST.t=Date.now();localStorage.setItem('ptc-state',JSON.stringify(ST))}
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{saveT=null;try{writeState();setSync('Saved on this phone')}catch(e){setSync(failMsg,true)}},400)}
function saveDay(k){const d=DD[k];if(d){d.t=Date.now();const p=ST.profiles.find(x=>x.id===d.pid);if(p&&d.date>=dayKey())d.plan=planned(p,d.date).map(e=>e.id)}
  clearTimeout(dayTimers[k]);dayTimers[k]=setTimeout(()=>{delete dayTimers[k];try{writeDays();setSync('Saved on this phone')}catch(e){setSync(failMsg,true)}},300)}
function flushNow(){let s1=false,s2=false;if(saveT){clearTimeout(saveT);saveT=null;s1=true}for(const k in dayTimers){clearTimeout(dayTimers[k]);delete dayTimers[k];s2=true}
  try{if(s1)writeState();if(s2)writeDays()}catch(e){setSync(failMsg,true)}}
window.addEventListener('pagehide',flushNow);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushNow();else syncFromStorage()});
window.addEventListener('storage',e=>{if(e.key==='ptc-days'||e.key==='ptc-state')syncFromStorage()});
function syncFromStorage(){let changed=mergeStoredDays();
  const st=readStored('ptc-state',null);if(st&&st.t&&st.t>(ST.t||0)&&!saveT){ST=migrate(st);changed=true;loadVideos().then(()=>{if(!busy())render()})}
  if(changed&&!busy())render()}

/* ============ program logic ============ */
const prof=()=>ST.profiles.find(p=>p.id===ST.activeId)||ST.profiles[0];
const docKey=(p,date)=>p.id+'_'+date;
const docOf=(p,date)=>DD[docKey(p,date)];
function ensureDoc(p,date){const k=docKey(p,date);if(!DD[k])DD[k]={pid:p.id,date,checked:{},reps:{},names:{},out:{},in:{},skipCarry:{},pain:null,note:''};const d=DD[k];for(const f of ['checked','reps','names','out','in','skipCarry'])d[f]=d[f]||{};return d}
const exById=(p,id)=>p.lib.find(e=>e.id===id);
function weekNo(p,date){return Math.max(1,Math.floor(diffDays(p.startDate,date)/7)+1)}
function repsFor(p,ex,date){if(!ex)return 0;return ex.progress===false?ex.reps:ex.reps+(p.increment||0)*(weekNo(p,date)-1)}
const anyChecked=d=>d&&d.checked&&Object.values(d.checked).some(Boolean);
// What's on a given date: that weekday's schedule, minus anything moved away, plus anything moved in.
function planned(p,date){const d=docOf(p,date);let ids=(p.week[wd(date)]||[]).slice();
  if(d&&d.out)ids=ids.filter(id=>!d.out[id]);
  if(d&&d.in)for(const id in d.in)if(d.in[id]&&!ids.includes(id))ids.push(id);
  return ids.map(id=>exById(p,id)).filter(Boolean)}
function groupsOf(list){const s=new Set(list.map(e=>e.group));return STRENGTH.filter(g=>s.has(g))}
function dayTitle(list){const g=groupsOf(list);if(g.length)return g.map(x=>GROUPS[x].name).join(' · ');if(list.some(e=>e.group==='stretch'))return'Stretching';if(list.length)return GROUPS[list[0].group].name;return'Rest day'}
function dayShort(list){const g=groupsOf(list);if(g.length)return GROUPS[g[0]].short;if(list.length)return GROUPS[list[0].group].short;return'Rest'}
// Exercises skipped on a day you did part of the workout. They carry over until ticked, moved or dropped.
function missedFor(p,today){
  const docs=Object.values(DD).filter(x=>x&&x.pid===p.id&&x.date<today).sort((a,b)=>a.date<b.date?-1:1);const pend=new Map();
  for(const x of docs){
    for(const id in (x.checked||{}))if(x.checked[id])pend.delete(id);
    for(const id in (x.skipCarry||{}))if(x.skipCarry[id])pend.delete(id);
    for(const id in (x.skip||{}))if(x.skip[id])pend.delete(id);
    for(const id in (x.in||{}))if(x.in[id])pend.delete(id); // moved into a later day: that day owns it now
    if(!x.plan||!x.plan.some(id=>x.checked&&x.checked[id]))continue;
    for(const id of x.plan)if(!(x.checked&&x.checked[id])&&!(x.out&&x.out[id])){const o=pend.get(id);pend.set(id,{since:o?o.since:x.date,last:x.date})}
  }
  const d=docOf(p,today),inToday=new Set(planned(p,today).map(e=>e.id));const out=[];
  // wait a day if that muscle group was worked yesterday
  const y=docOf(p,addDays(today,-1)),yGroups=new Set(y?Object.keys(y.checked||{}).filter(i=>y.checked[i]).map(i=>exById(p,i)).filter(Boolean).map(e=>e.group).filter(g=>STRENGTH.includes(g)):[]);
  for(const [id,m] of pend){const ex=exById(p,id);if(!ex||inToday.has(id)||(d&&d.skipCarry&&d.skipCarry[id])||yGroups.has(ex.group))continue;out.push({ex,...m})}
  return out}
function missedLabel(m,today){if(m.since===addDays(today,-1))return'Missed yesterday';if(m.since===m.last)return'Missed '+fmtDay(m.since);return'Missed since '+fmtDay(m.since)}
function isTrainDay(p,date){return planned(p,date).length>0}
function firstDate(p){let f=p.startDate;for(const k in DD){const x=DD[k];if(x&&x.pid===p.id&&x.date<f)f=x.date}return f}
// Streak: days with something ticked; rest days and days off keep it going.
function streak(p){const set=new Set(Object.values(DD).filter(x=>x&&x.pid===p.id&&anyChecked(x)).map(x=>x.date));let k=dayKey(),n=0,g=0;if(!set.has(k))k=addDays(k,-1);const f0=firstDate(p);
  while(g++<730&&k>=f0){const d=docOf(p,k);if(set.has(k))n++;else if(!(d&&d.off)&&isTrainDay(p,k)&&k>=(p.since||'0'))break;k=addDays(k,-1)}return n}
// Best day to move a sore exercise to: no same muscle group that day or the day before.
function moveOptions(p,ex,from){const out=[];let rec=null;
  for(let i=1;i<=7;i++){const k=addDays(from,i),list=planned(p,k),prev=i===1?planned(p,from).filter(e=>e.id!==ex.id):planned(p,addDays(k,-1));
    const same=list.some(e=>e.group===ex.group&&e.id!==ex.id),before=prev.some(e=>e.group===ex.group),already=list.some(e=>e.id===ex.id);
    const strength=STRENGTH.includes(ex.group),soon=i===1&&strength,ok=!already&&!soon&&(!strength||(!same&&!before));
    const o={k,list,same:strength&&same,before:strength&&before,already,soon,ok};if(ok&&!rec){rec=o;o.rec=true}out.push(o)}
  return out}
function moveEx(p,id,from,to){const a=ensureDoc(p,from);const inBase=(p.week[wd(from)]||[]).includes(id);
  if(inBase)a.out[id]=to||'skip';else if(a.in[id])delete a.in[id];else a.skipCarry[id]=true;
  delete a.checked[id];saveDay(docKey(p,from));
  if(to){const b=ensureDoc(p,to);if((p.week[wd(to)]||[]).includes(id))delete b.out[id];else b.in[id]=from;saveDay(docKey(p,to))}}

function nextTrain(p,from){for(let i=1;i<=7;i++){const k=addDays(from,i);if(planned(p,k).length)return k}return null}
function dayInfo(p,k){

function dayDetail(p,k,today){

      if(on){d.reps[id]=d.reps[id]||(ex?repsFor(p,ex,k):0);if(ex)d.names[id]=ex.name}else delete d.reps[id];
      saveDay(docKey(p,k));render();break}
    case'edpain':{const d=ensureDoc(p,editDay);d.pain=d.pain===+id?null:+id;saveDay(docKey(p,editDay));render();break}
    case'peek':{view='week';selDay=id;editDay=null;weekOff=Math.round(diffDays(mondayOf(today),mondayOf(id))/7);render();window.scrollTo(0,0);break}
    case'wkprev':weekOff--;selDay=addDays(mondayOf(today),7*weekOff+(weekOff===0?(wd(today)+6)%7:0));editDay=null;render();break;
    case'wknext':weekOff++;selDay=addDays(mondayOf(today),7*weekOff+(weekOff===0?(wd(today)+6)%7:0));editDay=null;render();break;
    case'wkthis':weekOff=0;selDay=today;editDay=null;render();break;
    case'wkday':selDay=id;if(editDay&&editDay!==id){editDay=null;editAll=false}render();{const el=$('daydetail');el&&el.scrollIntoView({block:'nearest',behavior:'smooth'})}break;
    case'ptab':progTab=id;render();break;
    case'rebuild':buildWeek(p);save();render();setSync('Week rebuilt');break;
    case'presets':MD={kind:'preset'};openModal(presetList());break;
    case'presetpick':MD={kind:'preset',key:id};openModal(presetForm());break;
    case'presetload':loadPreset(p,MD.key);ST.exampleBanner=false;save();closeModal();progTab=null;view='program';render();window.scrollTo(0,0);setSync('Plan added');break;
    case'up':case'down':{const di=+progTab,list=p.week[di]||[],i=list.indexOf(id),j=a==='up'?i-1:i+1;if(i<0||j<0||j>=list.length)break;[list[i],list[j]]=[list[j],list[i]];save();render();break}
    case'dayrm':{const di=+progTab;p.week[di]=(p.week[di]||[]).filter(x=>x!==id);p.auto=false;save();render();break}
    case'dayadd':MD={kind:'pick',day:+progTab};openModal(pickForm());break;
    case'pick':{const di=MD.day;(p.week[di]=p.week[di]||[]).push(id);p.auto=false;save();closeModal();render();break}
    case'picknew':{const di=MD.day;MD={kind:'ex',isNew:true,ex:newEx({group:'other'}),days:[di],cancelUploads:[],removed:[]};openModal(exForm());break}
    case'exadd':MD={kind:'ex',isNew:true,ex:newEx({group:'other'}),days:[],cancelUploads:[],removed:[]};openModal(exForm());break;
    case'exedit':MD={kind:'ex',isNew:false,ex:clone(exById(p,id)),days:scheduleDaysOf(p,id),cancelUploads:[],removed:[]};openModal(exForm());break;
    case'vremove':readExForm();if(MD.ex.videoId)MD.removed.push(MD.ex.videoId);MD.ex.videoId='';MD.ex.videoUrl='';openModal(exForm());break;
    case'exsave':{readExForm();if(!MD.ex.name){$('f-name').focus();$('f-name').placeholder='Give it a name';break}
      if(MD.isNew&&MD.ex.group==='other')MD.ex.group=guessGroup(MD.ex);
      const i=p.lib.findIndex(x=>x.id===MD.ex.id);if(i<0)p.lib.push(MD.ex);else p.lib[i]=MD.ex;
      const before=scheduleDaysOf(p,MD.ex.id).join();
      for(const d of WEEK_ORDER){const l=p.week[d]=p.week[d]||[];const want=MD.days.includes(d),has=l.includes(MD.ex.id);if(want&&!has)l.push(MD.ex.id);if(!want&&has)p.week[d]=l.filter(x=>x!==MD.ex.id)}
      if(MD.isNew&&!MD.days.length)placeOne(p,MD.ex);else if(before!==scheduleDaysOf(p,MD.ex.id).join())p.auto=false;
      for(const v of MD.removed)if(!MD.cancelUploads.includes(v))assets&&assets.delete(v).catch(()=>{});
      MD.cancelUploads=MD.cancelUploads.filter(x=>x!==MD.ex.videoId);save();closeModal();render();break}
    case'exdel':{if(!MD.confirmDel){readExForm();MD.confirmDel=true;openModal(exForm());break}removeEx(p,MD.ex.id);save();closeModal();render();break}
    case'addprof':MD={kind:'p',isNew:true,p:newProfile('',ST.profiles.length,false)};openModal(profForm());break;
    case'editprof':MD={kind:'p',isNew:false,p:clone(p)};openModal(profForm());break;
    case'psave':{const name=$('p-name').value.trim();if(!name){$('p-name').focus();break}
      const np=MD.p,inc=Math.max(0,Math.min(50,parseInt($('p-inc').value,10)||0)),wk=Math.max(1,parseInt($('p-wk').value,10)||1);
      np.name=name;np.increment=inc;np.reminder={time:$('p-time').value};np.startDate=addDays(mondayOf(today),-7*(wk-1));
      const i=ST.profiles.findIndex(x=>x.id===np.id);if(i<0){ST.profiles.push(np);ST.activeId=np.id}else Object.assign(ST.profiles[i],{name:np.name,increment:np.increment,reminder:np.reminder,startDate:np.startDate});
      save();closeModal();render();break}
    case'pdel':{if(!MD.confirmDel){MD.p.name=$('p-name').value||MD.p.name;MD.confirmDel=true;openModal(profForm());break}
      const gone=ST.profiles.find(x=>x.id===MD.p.id);if(gone)for(const ex of gone.lib)if(ex.videoId)assets&&assets.delete(ex.videoId).catch(()=>{});
      ST.profiles=ST.profiles.filter(x=>x.id!==MD.p.id);ST.activeId=ST.profiles[0].id;save();closeModal();render();break}
    case'backup':{const data={app:'family-pt-coach',saved:new Date().toISOString(),state:ST,days:DD};const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
      const fn='pt-backup-'+dayKey()+'.json';const file=new File([blob],fn,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'PT backup'}).catch(()=>{})}
      else{const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
      ST.lastBackup=dayKey();save();MD.bok='Backup saved as '+fn;MD.berr='';openModal(profForm());break}
    case'mclose':case'mbg':closeModal();break;
    case'shold':beep(660,.08);S.phase='hold';S.until=Date.now()+S.ex.holdSec*1000;renderDyn();break;
    case'srep':S.rep++;beep(700,.05);if(S.rep>=S.ex.reps){beep(990,.3);sideDone()}if(S)renderDyn();break;
    case'sundo':if(S.rep>0)S.rep--;renderDyn();break;
    case'spause':if(S.paused){S.paused=false;S.until=Date.now()+S.left}else{S.paused=true;S.left=Math.max(0,S.until-Date.now())}renderDyn();break;
    case'sskip':S.until=0;S.paused=false;S.phase='ready';renderDyn();break;
    case'ssetdone':S.until=0;S.paused=false;S.rep=0;setDone();if(S)renderDyn();break;
    case'sall':finishTimer(true);break;
    case'squit':finishTimer(false);break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='ed-note'){const p=prof(),k=e.target.dataset.day,d=docOf(p,k);if(d){d.note=e.target.value.slice(0,1000);saveDay(docKey(p,k))}}
  if(e.target.id==='t-note'){const p=prof(),d=docOf(p,dayKey());if(d){d.note=e.target.value.slice(0,1000);saveDay(docKey(p,dayKey()))}}
});
document.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.a==='tday'){const p=prof(),i=+e.target.dataset.id;p.trainDays=WEEK_ORDER.filter(d=>d===i?e.target.checked:(p.trainDays||[]).includes(d));
    if(p.auto)buildWeek(p);else if(!e.target.checked){for(const id of (p.week[i]||[]).slice()){const ex=exById(p,id);p.week[i]=p.week[i].filter(x=>x!==id);if(ex&&!scheduleDaysOf(p,id).length)placeOne(p,ex)}}
    save();render();return}
  if((e.target.id==='f-demo'||e.target.id==='f-unit'||e.target.id==='f-group')&&MD){readExForm();if(e.target.id==='f-group'&&MD.isNew)MD.ex.progress=MD.ex.group!=='stretch';openModal(exForm());return}
  if(e.target.id==='f-restore'&&MD){const f=e.target.files&&e.target.files[0];if(!f)return;
    try{const data=JSON.parse(await f.text());if(data.app!=='family-pt-coach'||!data.state)throw new Error('not a PT backup');
      ST=migrate(data.state);DD=data.days||{};const now=Date.now();for(const k in DD)if(DD[k])DD[k].t=now;await loadVideos();try{writeState();localStorage.setItem('ptc-days',JSON.stringify(DD))}catch(x){setSync(failMsg,true)}
      closeModal();render();setSync('Backup restored')}catch(err){MD.berr='That file isn’t a PT Coach backup ('+err.message+').';MD.bok='';openModal(profForm())}return}
  if(e.target.id!=='f-vid'||!MD)return;
  const file=e.target.files&&e.target.files[0];if(!file)return;readExForm();MD.verr='';
  if(file.size>150*1024*1024){MD.verr='That clip is '+(file.size/1048576).toFixed(0)+' MB. Trim it under 150 MB and try again.';openModal(exForm());return}
  MD.uploading=true;openModal(exForm());
  try{const r=await assets.upload(file);if(!MD)return;if(MD.ex.videoId)MD.removed.push(MD.ex.videoId);MD.ex.videoId=r.id;MD.ex.videoUrl=r.url;MD.cancelUploads.push(r.id)}catch(err){if(MD)MD.verr='Couldn’t save the video: '+(err&&err.message||'phone storage may be full')+'.'}
  if(MD){MD.uploading=false;openModal(exForm())}
});
document.addEventListener('visibilitychange',()=>{if(S&&document.visibilityState==='visible')lockScreen()});
let lastDay=dayKey();setInterval(()=>{if(dayKey()!==lastDay){lastDay=dayKey();if(!S&&!MD)render()}},60000);
const busy=()=>S||MD||(document.activeElement&&['t-note','ed-note'].includes(document.activeElement.id));

/* ============ start ============ */
render();
(async()=>{
  await loadVideos();if(!busy())render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
})();
</script>
